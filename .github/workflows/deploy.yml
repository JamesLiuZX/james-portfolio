name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress production deploys are allowed to
# finish rather than being cancelled by a newer push.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json, so the
      # lockfile format and the pnpm that reads it cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `static_site_generator: next` on purpose: that option rewrites
      # next.config at build time to inject `output: 'export'` plus a basePath.
      # The export is already declared in next.config.mjs, and the site is
      # served from an apex custom domain, so it must not carry a basePath.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # `next export` was removed in Next 13; `output: 'export'` makes
      # `next build` write the static site straight to ./out.
      - name: Build
        run: pnpm build

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — the export did not run"; exit 1; }
          test -f out/CNAME    || { echo "::error::out/CNAME missing — the custom domain would be dropped"; exit 1; }
          echo "Exported $(find out -name '*.html' | wc -l) HTML pages"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
