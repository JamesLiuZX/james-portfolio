name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. In-progress production deploys are allowed to
# finish rather than being cancelled by a newer push.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from the "packageManager" field in package.json, so the
      # lockfile format and the pnpm that reads it cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `static_site_generator: next` on purpose: that option rewrites
      # next.config at build time to inject `output: 'export'` plus a basePath.
      # The export is already declared in next.config.mjs, and the site is
      # served from an apex custom domain, so it must not carry a basePath.
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      # Kino's web demo: the studio's real interface on an in-browser engine,
      # rebuilt on every deploy from Kino's own repository (JamesLiuZX/kino,
      # checked out into kino/) and served at /kino/ (Next copies public/ into
      # the export as-is). Its two in-browser models are made from their
      # upstream releases (kino/scripts/web-models.py, cached until that script
      # changes) and run with ONNX Runtime Web from npm.
      - name: Check out Kino
        uses: actions/checkout@v4
        with:
          repository: JamesLiuZX/kino
          path: kino

      - name: Restore the Kino web demo's models
        id: kino-models
        uses: actions/cache@v4
        with:
          path: kino/web/models
          key: kino-web-models-${{ hashFiles('kino/scripts/web-models.py') }}

      - if: steps.kino-models.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make the Kino web demo's models
        if: steps.kino-models.outputs.cache-hit != 'true'
        run: |
          pip install --quiet onnx onnxruntime numpy
          python3 kino/scripts/web-models.py kino/web/models /tmp/kino-model-sources

      # Kino's other dev dependencies build its desktop app; skip Electron's
      # 100 MB download.
      - name: Install ONNX Runtime Web for the Kino web demo
        working-directory: kino
        run: npm ci --no-audit --no-fund --omit=optional
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build the Kino web demo
        run: node kino/web/build.mjs public/kino --strict

      # `next export` was removed in Next 13; `output: 'export'` makes
      # `next build` write the static site straight to ./out.
      - name: Build
        run: pnpm build

      - name: Verify export output
        run: |
          test -f out/index.html || { echo "::error::out/index.html missing — the export did not run"; exit 1; }
          test -f out/CNAME    || { echo "::error::out/CNAME missing — the custom domain would be dropped"; exit 1; }
          test -f out/kino/index.html || { echo "::error::out/kino/index.html missing — the Kino web demo didn't build"; exit 1; }
          test -f out/kino/engine/models/manifest.json -a -f out/kino/engine/ort/ort.webgpu.min.js || { echo "::error::the Kino web demo's models or runtime are missing"; exit 1; }
          echo "Exported $(find out -name '*.html' | wc -l) HTML pages"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
